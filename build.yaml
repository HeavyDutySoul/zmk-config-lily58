# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nrf52840dongle_nrf52840
    shield: lily58_dongle
    snippet: nrf52840-nosd studio-rpc-usb-uart
    artifact-name: lily58_dongle_zmk
  - board: nrf52840dongle_nrf52840
    shield: lily58_dongle
    snippet: nrf52840-nosd studio-rpc-usb-uart cdc-acm-console
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_CBPRINTF_COMPLETE=y
    artifact-name: lily58_dongle_zmk_log
  - board: mikoto@6//zmk
    shield: lily58_left_central
    snippet: nrf52840-nosd
    cmake-args: -DCONFIG_BOARD_MIKOTO_CHARGER_CURRENT_40MA=y
    artifact-name: lily58_left_central_zmk
  - board: mikoto@6//zmk
    shield: lily58_left_peripheral
    snippet: nrf52840-nosd
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_BOARD_MIKOTO_CHARGER_CURRENT_40MA=y
    artifact-name: lily58_left_peripheral_zmk   
  - board: mikoto@6//zmk
    shield: lily58_right_peripheral
    snippet: nrf52840-nosd
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_BOARD_MIKOTO_CHARGER_CURRENT_40MA=y
    artifact-name: lily58_right_peripheral_zmk
  - board: mikoto@6//zmk
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: lily58_settings_reset
  - board: nrf52840dongle_nrf52840
    shield: settings_reset
    artifact-name: lily58_dongle_settings_reset
    snippet: nrf52840-nosd
